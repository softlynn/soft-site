<!doctype html>
<html lang="en" style="background-color: #fff1a8">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff1a8" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("softu-theme-mode");
          var mode = saved === "light" || saved === "dark" ? saved : "light";
          document.documentElement.setAttribute("data-soft-theme", mode);
          document.documentElement.style.backgroundColor = mode === "dark" ? "#101010" : "#fff1a8";
        } catch (error) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Poppins:wght@300;400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <title>soft</title>
    <meta name="description" content="Watch soft's VOD archive with chat replay." />

    <meta itemprop="name" content="soft" />
    <meta itemprop="description" content="Watch soft's VOD archive with chat replay." />
    <meta itemprop="image" content="./meta_image.png" />

    <meta property="og:url" content="https://softu.one" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="soft" />
    <meta property="og:description" content="Watch soft's VOD archive with chat replay." />
    <meta property="og:image" content="https://softu.one/meta_image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="soft" />
    <meta name="twitter:description" content="Watch soft's VOD archive with chat replay." />
    <meta name="twitter:image" content="https://softu.one/meta_image.png" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
