<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;
        var destination = window.location.origin + "/";
        try {
          window.sessionStorage.setItem("softu-spa-redirect", path);
        } catch (error) {
          // The app also accepts a URL handoff when browser storage is blocked.
          destination += "#" + path;
        }
        window.location.replace(destination);
      })();
    </script>
    <title>soft</title>
  </head>
  <body></body>
</html>
